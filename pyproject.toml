[project]
name = "letterboxarr"
version = "1.0.0"
description = "Automatically sync your Letterboxd watchlist to your Radarr instance"
requires-python = ">=3.9"
dependencies = [
    "requests==2.32.4",
    "beautifulsoup4==4.12.2",
    "pyyaml==6.0.1",
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-jose[cryptography]==3.4.0",
    "passlib[bcrypt]==1.7.4",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends calls in defaults to declare injected dependencies.
"lib_api.py" = ["B008"]

[tool.bandit]
exclude_dirs = ["frontend"]
